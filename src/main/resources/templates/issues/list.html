<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>書籍一覧　｜　読書管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">書籍一覧</h1>
<a href="../index.html" th:href="@{/}">トップページへ</a>
<a href="./creationForm.html" th:href="@{/issues/creationForm}">登録画面へ</a>
<form th:action="@{/issues}" method="get" class="row g-3 my-3">
    <div class="col-auto">
        <input type="text" name="authorName" class="form-control" placeholder="著者名で検索" th:value="${searchAuthorName}">
    </div>
    <div class="col-auto">
        <select name="rating" class="form-select">
            <option value="">評価（すべて）</option>
            <option value="5" th:selected="${searchRating == 5}">★5</option>
            <option value="4" th:selected="${searchRating == 4}">★4</option>
            <option value="3" th:selected="${searchRating == 3}">★3</option>
            <option value="2" th:selected="${searchRating == 2}">★2</option>
            <option value="1" th:selected="${searchRating == 1}">★1</option>
        </select>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary">検索</button>
        <a th:href="@{/issues}" class="btn btn-outline-sevaondary">クリア</a>
    </div>
</form>
<table class="table table-striped w-auto">
    <thead>
    <tr>
        <th>ID</th>
        <th>書籍名</th>
        <th>著者名</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="issue : ${issueList}">
        <th th:text="${issue.id}">(id)</th>
        <td>
            <a href="./detail.html" th:href="@{/issues/{issueId}(issueId=${issue.id})}" th:text="${issue.bookTitle}">
                (bookName)
            </a>
        </td>
        <th th:text="${issue.authorName}">(authorName)</th>
    </tr>
    </tbody>
</table>

</body>
</html>
