<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>書籍登録　｜　読書管理アプリケーション</title>
</head>
<body>
<style>
    .star-rating {
        display: flex;
        flex-direction: row-reverse;
        justify-content: flex-end;
    }

    .star-rating input[type="radio"]{
        display: none;
    }

    .star-rating label {
        font-size: 2rem;
        color: #ccc;
        cursor: pointer;
        padding: 0 2px;
    }

    .star-rating.is-invalid {
        border: 1px solid #dc3545;
        border-radius: 4px;
        padding: 2px 8px;
        display: inline-flex;
    }

    .star-rating.is-invalid label{
        color: #f8d7da;
    }


    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input[type="radio"]:checked ~ label{
        color: #ffca28;
    }
</style>
<h1 class="mt-3">書籍登録</h1>
<form action="#" th:action="@{/issues}" th:method="post" th:object="${issueForm}">
    <div class="mt-3">
        <label for="bookTitleInput" class="form-label">書籍名</label>
        <input type="text" id="bookTitleInput" th:field="*{bookTitle}" class="form-control"
               th:classappend="${#fields.hasErrors('bookTitle')} ? 'is-invalid'">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('bookTitle')}" th:errors="*{bookTitle}">(error)</p>
    </div>
    <div class="mt-3">
        <label for="authorNameInput" class="form-label">著者名</label>
        <input type="text" id="authorNameInput" th:field="*{authorName}" class="form-control"
               th:classappend="${#fields.hasErrors('authorName')} ? 'is-invalid'">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('authorName')}" th:errors="*{authorName}">(error)</p>
    </div>
    <div class="mt-3" th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'">
        <label class="form-label">評価</label>
        <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5" th:checked="${issueForm != null and issueForm.rating == 5}" /><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4" th:checked="${issueForm != null and issueForm.rating == 4}" /><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3" th:checked="${issueForm != null and issueForm.rating == 3}" /><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2" th:checked="${issueForm != null and issueForm.rating == 2}" /><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1" th:checked="${issueForm != null and issueForm.rating == 1}" /><label for="star1">★</label>
        </div>
        <p class="invalid-feedback d-block" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}">(error)</p>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">登録</button>
        <a href="./list.html" th:href="@{/issues}" class="btn btn-secondary">キャンセル</a>
    </div>
</form>
</body>
</html>
