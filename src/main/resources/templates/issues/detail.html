<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>書籍情報　｜　読書管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">書籍情報</h1>
<a href="./list.html" th:href="@{/issues}">一覧に戻る</a>
<div>
    <h2 th:text="${issue.bookTitle}">(bookTitle)</h2>
    <p th:text="${issue.authorName}">(authorName)</p>
    <p>
        <span th:if="${issue.rating > 0}"
              th:each="i : ${#numbers.sequence(1, issue.rating)}"
              style="color: #ffca28;">★</span><span th:if="${issue.rating < 5 }"
                                                    th:each="i : ${#numbers.sequence(1, 5 - issue.rating)}"
                                                    style="color: #cccccc;">★</span>
    </p>
</div>
</body>
</html>
