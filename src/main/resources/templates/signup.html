<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規ユーザー登録</title>
</head>
<body>
<h2>新規ユーザー登録</h2>

<form th:action="@{/signup}" th:object="${signupForm}" method="post">
    <div>
        <label for="email">メールアドレス：</label>
        <input type="email" id="email" th:field="*{email}" required />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: #dc3545"></span>
    </div>

    <div>
        <label for="password">パスワード：</label>
        <input type="password" id="password" th:field="*{password}" required />
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: #dc3545"></span>
    </div>

    <button type="submit">登録する</button>
</form>

<br>
<a th:href="@{/login}">既にアカウントをお持ちの方（ログイン）</a>
</body>
</html>
